<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio del PEP · IBAMEX 2026</title>
<style>
:root{--navy:#002b55;--blue:#004b8d;--cyan:#1ab7ea;--sky:#b5daff;--mist:#eaf7fd;--ink:#13263a;--ok:#1d8a4e;--bad:#c8372d;--sun:#ffd25e;--line:#d3e0ea}
*{box-sizing:border-box}
body{margin:0;font-family:"Open Sans",Arial,Helvetica,sans-serif;background:#f4f8fb;color:var(--ink);line-height:1.45}
header.top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top b{font-size:18px;letter-spacing:.02em}
header.top .team{margin-left:auto;font-size:14px;opacity:.9}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:28px;color:var(--navy);margin:8px 0 6px}
h2{font-size:22px;color:var(--navy);margin:0 0 6px}
h3{font-size:16px;color:var(--blue);margin:18px 0 8px;letter-spacing:.04em;text-transform:uppercase}
p{margin:6px 0}
.lead{font-size:17px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,43,85,.08);padding:20px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.station{border:0;text-align:left;cursor:pointer;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,43,85,.08);border-top:5px solid var(--cyan);font:inherit;color:inherit}
.station:hover{transform:translateY(-2px)}
.station .n{font-size:13px;font-weight:800;color:var(--cyan);letter-spacing:.12em}
.station .t{font-size:18px;font-weight:800;color:var(--navy);margin:4px 0}
.station.done{border-top-color:var(--ok)}
.station .st{font-size:13px;font-weight:700}
.station.done .st{color:var(--ok)}
.quote{border-left:4px solid var(--cyan);background:var(--mist);padding:10px 14px;margin:10px 0;font-size:15px}
.quote small{display:block;color:#4e5f6d;margin-top:4px;font-size:12px}
.pill{display:inline-block;background:var(--mist);border:1px solid var(--sky);border-radius:20px;padding:3px 10px;margin:3px 4px 3px 0;font-size:14px}
table.info{width:100%;border-collapse:collapse;font-size:15px}
table.info td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.info td:first-child{font-weight:800;color:var(--navy);width:34%}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fff}
.q .txt{font-weight:600;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--sky);background:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.opt.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.q.right{border-color:var(--ok);background:#effaf3}
.q.wrong{border-color:var(--bad);background:#fdf1f0}
.fb{font-size:14px;margin-top:6px;display:none}
.q.right .fb,.q.wrong .fb{display:block}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;font-size:16px}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.result{font-weight:800;font-size:16px}
.code{display:inline-block;font-size:30px;font-weight:900;letter-spacing:.12em;color:var(--navy);background:var(--sun);border-radius:10px;padding:8px 18px;margin:8px 0}
.steps{counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-bottom:1px solid var(--line)}
.steps li:before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--cyan);color:#fff;font-weight:800;text-align:center;line-height:28px}
input[type=text]{font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--sky);border-radius:10px;width:min(360px,100%)}
.hide{display:none}
.tag{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--cyan)}
.small{font-size:13px;color:#4e5f6d}
.cont{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.cont div{background:var(--mist);border-radius:10px;padding:12px}
.cont b{display:block;color:var(--navy);font-size:16px}
.station.locked{opacity:.75;border-top-color:#9aa8b5}
.task.ok{border-top:5px solid var(--ok)}
.good{background:#e5f5ec;color:#145c35;border-radius:8px;padding:8px 10px;font-weight:700;margin-top:8px}
.badm{background:#fdecea;color:#8e2a22;border-radius:8px;padding:8px 10px;font-weight:700;margin:8px 0}
.build{min-height:52px;border:2px dashed var(--blue);border-radius:10px;padding:10px;font-size:17px;font-weight:700;background:var(--mist);margin:8px 0}
.pairs{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.colL,.colR{display:flex;flex-direction:column;gap:6px}
.pl,.pr{font:inherit;font-size:14px;text-align:left;border:2px solid var(--sky);background:#fff;border-radius:10px;padding:9px 10px;color:var(--ink);cursor:pointer}
.pl.cur{border-color:var(--blue);background:var(--mist);box-shadow:0 0 0 2px var(--blue)}
.pl.matched{border-color:var(--ok);background:#effaf3;color:#145c35}
.pr.used{opacity:.35}.pr.wrong{border-color:var(--bad);background:#fdf1f0}
.tagm{display:block;font-size:12px;font-weight:800;margin-top:4px}
.hlx{font-size:19px;line-height:2;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hlx span{cursor:pointer;border-radius:4px}.hlx span.on{background:var(--sun)}.hlx span.good{background:#bfe8cf}.hlx span.bad{background:#fdecea;text-decoration:line-through}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt.right,.opt.sel.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opts.scale{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:2px solid var(--blue);border-radius:10px;overflow:hidden}
.opts.scale .opt{border:0;border-radius:0;border-right:1px solid var(--sky)}
@media(max-width:560px){.code{font-size:21px;letter-spacing:.05em;padding:8px 10px}.pairs{grid-template-columns:1fr}.colR{flex-direction:row;flex-wrap:wrap}}
a.btn{display:inline-block;text-decoration:none}
</style></head><body>
<header class="top"><b>IBAMEX 2026 · Laboratorio del PEP</b><span class="team" id="teamLabel"></span></header>
<div class="wrap" id="app"></div>
<script>
var KEY='ibamex26-lab2';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
var state=load();state.done=state.done||{};state.open=state.open||{};state.t=state.t||{};
var TEAMS=['Brújula','Bombilla','Lupa','Llave'];
var THEMES=['Quiénes somos','Dónde nos encontramos en el tiempo y el espacio','Cómo nos expresamos','Cómo funciona el mundo','Cómo nos organizamos','Cómo compartimos el planeta'];
var CONCEPTS=['Forma','Función','Causa','Cambio','Conexión','Perspectiva','Responsabilidad'];
var TABLERO='https://ktyall.github.io/running-dictation/tablero.html#d3';
var S=[
{id:'cimientos',code:'RAIZ',name:'Los cimientos: misión, perfil y ATL',piece:'LOS',learn:'<p class="lead">Todo en el PEP responde a un <b>para qué</b> (la misión del IB) y a un <b>quién</b> (el perfil de la comunidad de aprendizaje). Las unidades son el camino; la misión y el perfil, el destino.</p>'+
'<div class="quote">«El Bachillerato Internacional tiene como meta formar personas solidarias, informadas y ávidas de conocimiento, capaces de contribuir a crear un mundo mejor y más pacífico, en el marco del entendimiento mutuo y el respeto intercultural.»<small>IB · Declaración de principios</small></div>'+
'<p>El <b>perfil</b> traduce la misión en diez atributos que la comunidad (alumnado y adultos) se esfuerza por demostrar:</p>'+
'<table class="info"><tr><td>Indagadores</td><td>Cultivamos la curiosidad y las habilidades para investigar, solos y con otras personas.</td></tr><tr><td>Informados e instruidos</td><td>Desarrollamos comprensión conceptual explorando varias disciplinas.</td></tr><tr><td>Pensadores</td><td>Pensamiento crítico y creativo; decisiones razonadas y éticas.</td></tr><tr><td>Buenos comunicadores</td><td>Nos expresamos en diversas lenguas y maneras; escuchamos otras perspectivas.</td></tr><tr><td>Íntegros</td><td>Honradez, equidad y responsabilidad por nuestros actos.</td></tr><tr><td>De mentalidad abierta</td><td>Valoramos nuestra cultura y la de otras personas; consideramos otros puntos de vista.</td></tr><tr><td>Solidarios</td><td>Empatía, respeto y acción para influir positivamente en otras personas.</td></tr><tr><td>Audaces</td><td>Enfrentamos la incertidumbre con determinación, ingenio y resiliencia.</td></tr><tr><td>Equilibrados</td><td>Bienestar físico, mental y emocional, propio y de los demás.</td></tr><tr><td>Reflexivos</td><td>Evaluamos nuestras ideas y experiencias para seguir aprendiendo.</td></tr></table>'+
'<p class="small">Resumen de IB · Perfil de la comunidad de aprendizaje. En una unidad se eligen pocos atributos y se practican de verdad, igual que las habilidades ATL.</p>'+'<h3>Habilidades de los enfoques del aprendizaje (ATL)</h3><p>El perfil dice <b>quiénes</b> queremos ser. Las habilidades ATL son <b>cómo</b> aprendemos. Son cinco categorías y se enseñan, se practican y se reflexionan dentro de las unidades, como hicieron ayer en Running Dictation.</p><table class="info"><tr><td>Pensamiento</td><td>Pensar de forma crítica y creativa; transferir lo aprendido.</td></tr><tr><td>Investigación</td><td>Formular preguntas, reunir y evaluar información.</td></tr><tr><td>Comunicación</td><td>Intercambiar información; leer, escribir, escuchar y hablar.</td></tr><tr><td>Sociales</td><td>Colaborar, resolver conflictos, asumir funciones en un grupo.</td></tr><tr><td>Autogestión</td><td>Organizarse, manejar el tiempo, cuidar el propio bienestar.</td></tr></table>',
 tasks:[
  {k:'order',q:'Reconstruyan la declaración de principios del IB. Toquen las piezas en orden.',parts:['El IB tiene como meta formar personas','solidarias, informadas','y ávidas de conocimiento,','capaces de contribuir a crear','un mundo mejor y más pacífico,','en el marco del entendimiento mutuo','y el respeto intercultural.'],why:'Esa es la misión. Todo lo demás del PEP responde a ella.'},
  {k:'pairs',q:'Momentos de estos dos días. Unan cada uno con el atributo del perfil que más se vio. Toquen un momento y después un atributo.',
   L:['Preguntaron a Camila «¿Qué pasa después?» para descubrir lo que pensaba.','Siguieron con la Prueba relámpago en inglés aunque no entendían todo.','En Tres cuadernos escucharon a Camila antes de juzgar su respuesta.','Movieron las palancas del simulador para que Diego, Sofía, Lucía y Mateo pudieran mostrar lo que saben.','Cada mañana reconstruyeron en el rotafolio lo que recordaban y lo que aún preguntaban.'],
   R:['Indagadores','Audaces','De mentalidad abierta','Solidarios','Reflexivos'],why:'El perfil no se enseña con un póster: se ve en lo que hacemos.'},
  {k:'pick',q:'¿A quién se aplica el perfil de la comunidad de aprendizaje?',o:['Solo al alumnado','Solo al personal docente','A toda la comunidad: alumnado y adultos'],a:2,why:'A toda la comunidad de aprendizaje.'},
  {k:'pick',q:'¿Cuántas categorías de habilidades ATL hay en el PEP?',o:['Tres','Cinco','Diez'],a:1,why:'Cinco: pensamiento, investigación, comunicación, sociales y autogestión.'},
  {k:'pick',q:'En Running Dictation, una persona corría, otra escribía y el equipo se ponía de acuerdo. ¿Qué categoría ATL se practicaba sobre todo?',o:['Sociales','Investigación','Autogestión'],a:0,why:'Colaborar, repartir funciones y llegar a acuerdos son habilidades sociales.'}]},
{id:'temas',code:'MAPA',name:'Los temas transdisciplinarios',piece:'PLA',learn:'<p class="lead">El programa de indagación del colegio se organiza en <b>seis temas transdisciplinarios</b>. Cada unidad vive dentro de un tema. El tema da el contexto; la idea central dice qué se va a comprender.</p>'+
'<div class="quote">Los temas transdisciplinarios tienen importancia personal, local y global, y dan el contexto con el que cada colegio organiza su programa de indagación.<small>Resumen basado en «El aprendizaje y la enseñanza» del PEP. Descriptores resumidos.</small></div>'+
'<table class="info"><tr><td>Quiénes somos</td><td>Identidad como individuos y como colectivo: salud y bienestar; relaciones y pertenencia; aprendizaje y desarrollo.</td></tr>'+
'<tr><td>Dónde nos encontramos en el tiempo y el espacio</td><td>Historias y orientación en el lugar, el espacio y el tiempo: épocas y acontecimientos; comunidades, patrimonio y cultura; movimiento, adaptación y transformación.</td></tr>'+
'<tr><td>Cómo nos expresamos</td><td>Diversidad de opiniones, perspectivas y expresiones: inspiración, imaginación y creatividad; prácticas de comunicación; interpretaciones y respuestas.</td></tr>'+
'<tr><td>Cómo funciona el mundo</td><td>Comprensión del mundo y sus fenómenos: patrones, ciclos y sistemas; prácticas, métodos y herramientas; descubrimiento, diseño e innovación.</td></tr>'+
'<tr><td>Cómo nos organizamos</td><td>Sistemas, estructuras y redes: sistemas sociales y ecológicos; formas de sustento y comercio; representación, colaboración y toma de decisiones.</td></tr>'+
'<tr><td>Cómo compartimos el planeta</td><td>Interdependencia del mundo humano y el natural: derechos, responsabilidades y dignidad de los seres vivos; futuros justos y pacíficos; naturaleza y coexistencia.</td></tr></table>'+
'<p class="small">Descriptores resumidos de la figura 6. Una idea podría tocar dos temas: decide el énfasis.</p>',
 tasks:[
  {k:'hl',q:'Esta idea central vive en un tema. Toquen las DOS palabras que lo delatan (están en los descriptores de arriba). Luego toquen «Revisar».',
   toks:[['Las comunidades ',0],['organizan ',0],['sistemas',1],[' de ',0],['comercio',1],[' para producir ',0],['y distribuir ',0],['lo que necesitan.',0]],why:'«Sistemas» y «comercio» aparecen en el descriptor de Cómo nos organizamos.'},
  {k:'pick',q:'Entonces, ¿en qué tema vive esa idea central?',o:THEMES,a:4,why:'Cómo nos organizamos: sistemas, sustento y comercio.'},
  {k:'pairs',q:'Unan cada idea central con su tema. Toquen una idea y después un tema.',
   L:['Nuestras relaciones y nuestro sentido de pertenencia influyen en nuestro bienestar.','A lo largo de la historia, las migraciones transforman las comunidades y su patrimonio.','Las personas crean mensajes para dirigirse a un público específico o influir en este.','Los ciclos y sistemas de la naturaleza siguen patrones que podemos observar y predecir.','Las decisiones sobre los recursos naturales cambian la vida de las comunidades.'],
   R:['Quiénes somos','Dónde nos encontramos en el tiempo y el espacio','Cómo nos expresamos','Cómo funciona el mundo','Cómo compartimos el planeta'],why:'La última es la idea que reconstruyeron ayer. La Unidad del Año vivía en Cómo compartimos el planeta.'}]},
{id:'conceptos',code:'LENTE',name:'Conceptos especificados y relacionados',piece:'NOS',learn:'<p class="lead">Los conceptos son la herramienta para que una unidad construya <b>comprensión</b> y no solo datos. El IB define <b>siete conceptos especificados</b>. Cada uno abre una pregunta distinta.</p>'+
'<div class="quote">Con los conceptos, el personal docente construye las ideas centrales y el alumnado construye comprensión conceptual.<small>Resumen basado en «El aprendizaje y la enseñanza» del PEP</small></div>'+
'<table class="info"><tr><td>Forma</td><td>¿Cómo es?</td></tr><tr><td>Función</td><td>¿Cómo funciona?</td></tr><tr><td>Causa</td><td>¿Por qué es así?</td></tr><tr><td>Cambio</td><td>¿Cómo está cambiando?</td></tr><tr><td>Conexión</td><td>¿Cómo está relacionado con otras cosas?</td></tr><tr><td>Perspectiva</td><td>¿Cuáles son los puntos de vista?</td></tr><tr><td>Responsabilidad</td><td>¿Cuáles son nuestras obligaciones?</td></tr></table>'+
'<p><b>En la práctica:</b> una unidad usa dos o tres conceptos especificados, no los siete. El ejemplo oficial del IB usa tres: función, perspectiva y responsabilidad.</p>'+'<h3>Conceptos relacionados</h3><p>Además de los conceptos especificados (en la plantilla: <b>conceptos clave</b>), cada unidad usa <b>conceptos relacionados</b>: propios de una disciplina, como erosión, oferta y demanda o ritmo. Dan profundidad.</p><p class="small">Ayer: la idea «Las decisiones sobre los recursos naturales cambian la vida de las comunidades» se mueve con causa, cambio y responsabilidad.</p>',
 tasks:[
  {k:'pairs',q:'Cada pregunta mira el mundo con un concepto especificado. Únanlos.',
   L:['¿Cómo es un ecosistema de manglar?','¿Cómo funciona el sistema digestivo?','¿Por qué se inundan algunas colonias cuando llueve?','¿Cómo ha cambiado nuestro barrio en 50 años?','¿Qué relación hay entre lo que comemos y nuestra energía?','¿Cómo cuentan la misma noticia dos periódicos?','¿Qué podemos hacer para reducir la basura del recreo?'],
   R:CONCEPTS,why:'Una pregunta, un lente.'},
  {k:'pick',q:'¿Cuál de estos es un concepto relacionado (de una disciplina), no un concepto especificado?',o:['Cambio','Erosión','Perspectiva'],a:1,why:'Erosión es propio de las ciencias. Cambio y perspectiva son conceptos especificados.'},
  {k:'pick',q:'La idea que reconstruyeron ayer: «Las decisiones sobre los recursos naturales cambian la vida de las comunidades». ¿Qué par de conceptos especificados la mueve mejor?',o:['Forma y función','Causa y responsabilidad','Perspectiva y forma'],a:1,why:'Las decisiones causan cambios, y alguien es responsable de ellas.'}]},
{id:'idea',code:'FARO',name:'Idea central y líneas de indagación',piece:'DEL',learn:'<p class="lead">La <b>idea central</b> es la comprensión que debe sobrevivir a la unidad. Es una oración en tono neutro que afirma una relación. No es un tema, ni una pregunta, ni una consigna.</p>'+
'<div class="quote">La idea central es una afirmación conceptual amplia que sirve de marco a toda la unidad de indagación.<small>Resumen basado en «El aprendizaje y la enseñanza» del PEP</small></div>'+
'<h3>Preguntas del IB para revisar una idea central</h3><ul><li>¿Apoya la comprensión conceptual?</li><li>¿Es lo suficientemente amplia como para ofrecer diversas líneas de indagación?</li><li>¿Está sustentada por conceptos?</li><li>¿Está abierta a una variedad de respuestas del alumnado?</li></ul>'+
'<h3>Líneas de indagación</h3><p>Cada unidad tiene <b>tres o cuatro líneas de indagación</b>, escritas como <b>enunciados o frases</b> (no como preguntas ni actividades). Aclaran la idea central y definen el alcance de la indagación. </p>'+
'<div class="quote"><b>Ejemplo</b> · Tema: Cómo nos expresamos · Idea central: Las personas crean mensajes para dirigirse a un público específico o influir en este. · Conceptos especificados: función, perspectiva, responsabilidad · Líneas: cómo se utilizan las imágenes, el texto y la música para influir en la conducta del público; evaluación crítica de los mensajes en los medios; cómo responden las personas a los mensajes.<small>Basado en un ejemplo de «El aprendizaje y la enseñanza» del PEP</small></div>',
 tasks:[
  {k:'order',q:'Armen la idea central del ejemplo oficial del IB.',parts:['Las personas','crean mensajes','para dirigirse','a un público específico','o influir en este.'],why:'Afirma una relación entre las personas, los mensajes y el público.'},
  {k:'sort',q:'La aduana otra vez. Clasifiquen cada frase.',o:['Tema','Idea central débil','Idea central fuerte'],
   items:[['«Los volcanes»',0,'Tema: nombra un contenido.'],['«Debemos cuidar el agua»',1,'Débil: es una consigna, no deja espacio a distintas respuestas.'],['«Las fuerzas naturales transforman la Tierra y obligan a las comunidades a adaptarse»',2,'Fuerte: afirma una relación que viaja.'],['«Los recursos naturales son importantes»',1,'Débil: era la idea de la Unidad del Año.'],['«Los mercados»',0,'Tema.']]},
  {k:'sort',q:'Para la idea oficial de arriba, ¿cuáles sirven como líneas de indagación?',o:['Sirve como línea','No sirve'],
   items:[['«Cómo responden las personas a los mensajes»',0,'Sí: enunciado que aclara la idea central.'],['«Hacer un cartel publicitario»',1,'No: es una actividad.'],['«¿Qué es la publicidad?»',1,'No: es una pregunta y es muy estrecha.'],['«Evaluación crítica de los mensajes en los medios de comunicación»',0,'Sí: es una línea del ejemplo oficial.']]}]},
{id:'indagacion',code:'PUENTE',name:'Estructurada, guiada o abierta',piece:'PEP',learn:'<p class="lead">La indagación no es una sola cosa. Va de más estructurada a más abierta, y el docente decide con intención cuál usar en cada momento.</p>'+
'<div class="cont"><div><b>Estructurada</b>El alumnado recibe datos o información para analizar.</div><div><b>Guiada</b>El docente presenta las preguntas iniciales; el alumnado decide métodos, soluciones y nuevas preguntas.</div><div><b>Abierta</b>El alumnado plantea sus propias preguntas y halla soluciones.</div></div>'+
'<div class="quote">La indagación va de estructurada (el alumnado analiza datos que recibe), a guiada, a abierta (el alumnado plantea sus preguntas y busca soluciones).<small>Resumen basado en «El aprendizaje y la enseñanza» del PEP, a partir de Bonnstetter (1998)</small></div>'+
'<div class="quote">En el PEP, la indagación guiada es el enfoque pedagógico principal.<small>Resumen basado en «El aprendizaje y la enseñanza» del PEP</small></div>'+
'<p>La enseñanza directa también tiene lugar en un aula que indaga, cuando es necesaria para apoyar la comprensión común. </p>',
 tasks:[
  {k:'sort',scale:1,q:'Ubiquen cada escena en la línea, de más estructurada a más abierta.',o:['Estructurada','Guiada','Abierta'],
   items:[['La maestra entrega los datos de temperatura de la semana y pide explicar el patrón.',0,'Reciben los datos para analizar.'],['El maestro pregunta por qué se desperdicia comida en el comedor. Cada equipo decide cómo investigar.',1,'Pregunta del docente, métodos del alumnado.'],['Después de una salida al parque, cada equipo formula su propia pregunta.',2,'La pregunta nace del alumnado.'],['El grupo sigue paso a paso un experimento con resultados esperados.',0,'Todo está definido de antemano.'],['Un estudiante pregunta por qué su abuela habla otra lengua y el grupo lo convierte en su investigación.',2,'La pregunta del alumnado dirige.']]},
  {k:'pick',q:'¿Qué enfoque enfatiza el PEP como principal?',o:['La indagación abierta','La indagación guiada','La enseñanza directa'],a:1,why:'En el PEP, la indagación guiada es el enfoque pedagógico principal.'},
  {k:'pick',q:'Una maestra quiere pasar de una indagación estructurada a una guiada. ¿Qué cambia?',o:['Da más datos para analizar','Ella plantea la pregunta inicial y el alumnado decide cómo investigar','El alumnado elige el tema y la pregunta'],a:1,why:'En la guiada, la pregunta inicial es del docente y los caminos son del alumnado.'}]}
];
/* ---------- helpers ---------- */
function shuf(n,seed){var a=[];for(var i=0;i<n;i++)a.push(i);var x=seed;for(var j=n-1;j>0;j--){x=(x*9301+49297)%233280;var r=Math.floor(x/233280*(j+1));var t=a[j];a[j]=a[r];a[r]=t}return a}
function seedOf(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%233280;return h}
function app(){return document.getElementById('app')}
function setTeam(){document.getElementById('teamLabel').textContent=state.team?('Equipo '+state.team):''}
function unlock(code){code=(code||'').trim().toUpperCase();for(var i=0;i<S.length;i++)if(S[i].code==code){state.open[S[i].id]=1;save();return i}return -1}
function home(){
 setTeam();var a=app();
 if(!state.team){a.innerHTML='<h1>Bienvenidos al laboratorio</h1><p class="lead">Ayer y anteayer vivieron <b>por qué</b> el PEP funciona. Hoy aprenden <b>con qué herramientas</b> se construye una unidad: los planos del PEP.</p><div class="card"><h3>Elijan su equipo</h3><div class="opts" id="tm"></div></div>';
  TEAMS.forEach(function(t){var b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=function(){state.team=t;save();route()};a.querySelector('#tm').appendChild(b)});return}
 var n=Object.keys(state.done).length;
 a.innerHTML='<h1>Los planos del PEP</h1><p class="lead">Hay <b>cinco carteles</b> en el salón. Levántense, busquen un cartel y <b>escaneen su QR</b> para abrir la estación. En cada una: lean, resuelvan el reto en equipo y ganen una pieza del código. El orden no importa.</p><div class="grid" id="st"></div><div class="card"><h3>¿Sin cámara?</h3><p class="small">Escriban el código que aparece en el cartel.</p><div class="row"><input type="text" id="cd" placeholder="Código del cartel" autocapitalize="characters"><button class="btn" id="go">Abrir</button></div><p class="small" id="cdm"></p></div><div class="card" id="fin"></div>';
 S.forEach(function(st,i){var d=!!state.done[st.id],o=!!state.open[st.id];var b=document.createElement('button');b.className='station'+(d?' done':'')+(o?'':' locked');
  b.innerHTML='<div class="n">ESTACIÓN '+(i+1)+'</div><div class="t">'+st.name+'</div><div class="st">'+(d?'✓ Pieza: '+st.piece:o?'Abierta · continuar':'🔒 Escaneen el cartel '+(i+1))+'</div>';
  b.onclick=function(){if(o||d)station(i);else{var m=document.getElementById('cdm');m.textContent='Esta estación se abre en su cartel. Búsquenlo en el salón.';}};a.querySelector('#st').appendChild(b)});
 a.querySelector('#go').onclick=function(){var i=unlock(a.querySelector('#cd').value);if(i<0)a.querySelector('#cdm').textContent='Ese código no existe. Revisen el cartel.';else station(i)};
 var f=a.querySelector('#fin');
 if(n<S.length){f.innerHTML='<h3>Código del equipo</h3><p>Piezas: '+S.map(function(s){return state.done[s.id]?'<b>'+s.piece+'</b>':'___'}).join(' · ')+'</p><p class="small">Cuando tengan las cinco, aparecerá el código completo.</p>'}
 else{f.innerHTML='<div class="tag">LABORATORIO COMPLETO</div><div class="code">LOS·PLA·NOS·DEL·PEP</div><p>Muestren este código al facilitador.</p><p>Ahora construyan su unidad en el tablero del equipo, pestaña Día 3. Cada sección les recuerda qué estación o qué día la explica.</p><p><a class="btn" href="'+TABLERO+'">Abrir el tablero · Día 3</a></p>'}
 var r=document.createElement('p');r.className='small';r.innerHTML='<a href="#" id="chg">Cambiar de equipo</a>';a.appendChild(r);a.querySelector('#chg').onclick=function(e){e.preventDefault();if(confirm('¿Cambiar de equipo? Se borra el avance en este celular.')){state={done:{},open:{},t:{}};save();home()}};
 window.scrollTo(0,0)}
function station(i){
 var st=S[i],a=app();state.open[st.id]=1;save();
 a.innerHTML='<p><a href="#" id="back">← Volver a las estaciones</a></p><div class="tag">ESTACIÓN '+(i+1)+' · APRENDAN</div><h2>'+st.name+'</h2><div class="card">'+st.learn+'</div><div class="tag">RETO EN EQUIPO · '+st.tasks.length+' PARTES</div><div id="tasks"></div><div id="res"></div>';
 a.querySelector('#back').onclick=function(e){e.preventDefault();home()};
 drawTasks(i);window.scrollTo(0,0)}
function tst(i,k){var key=S[i].id+'_'+k;state.t[key]=state.t[key]||{};return state.t[key]}
function drawTasks(i){
 var st=S[i],box=document.getElementById('tasks');if(!box)return;box.innerHTML='';
 var allDone=true;
 for(var k=0;k<st.tasks.length;k++){var t=st.tasks[k],s=tst(i,k);var c=document.createElement('div');c.className='card task'+(s.ok?' ok':'');
  c.innerHTML='<div class="tag">PARTE '+(k+1)+'</div><h3 style="text-transform:none;letter-spacing:0;font-size:17px;color:var(--navy)">'+t.q+'</h3><div class="body"></div><div class="fbk"></div>';
  box.appendChild(c);
  ({pick:dPick,order:dOrder,pairs:dPairs,hl:dHl,sort:dSort})[t.k](i,k,t,s,c.querySelector('.body'),c.querySelector('.fbk'));
  if(!s.ok){allDone=false;break}}
 var res=document.getElementById('res');
 if(allDone){if(!state.done[st.id]){state.done[st.id]=1;save()}
  res.innerHTML='<div class="card" style="border-top:5px solid var(--ok)"><div class="tag">ESTACIÓN COMPLETA</div><p>Pieza del código: <span class="code" style="font-size:22px;padding:4px 12px">'+st.piece+'</span></p><p>Busquen otro cartel en el salón.</p><button class="btn ghost" id="next">Volver a las estaciones</button></div>';document.getElementById('next').onclick=home}
 else res.innerHTML='<p class="small">Resuelvan esta parte para ver la siguiente.</p>'}
function okMsg(f,t){f.innerHTML='<div class="good">✓ '+t.why+'</div>'}
function redraw(i){var y=window.scrollY;drawTasks(i);window.scrollTo(0,y)}
/* pick */
function dPick(i,k,t,s,b,f){var ord=shuf(t.o.length,seedOf(S[i].id+k));
 ord.forEach(function(j){var x=document.createElement('button');x.className='opt'+(s.ok&&j==t.a?' sel right':'')+((s.bad||[]).indexOf(j)>-1?' wrong':'');x.textContent=t.o[j];x.disabled=!!s.ok;
  x.onclick=function(){if(j==t.a){s.ok=1}else{s.bad=s.bad||[];if(s.bad.indexOf(j)<0)s.bad.push(j)}save();redraw(i)};b.appendChild(x)});
 b.className='body opts';if(s.ok)okMsg(f,t);else if(s.bad&&s.bad.length)f.innerHTML='<div class="badm">Todavía no. Vuelvan a la información de arriba.</div>'}
/* order */
function dOrder(i,k,t,s,b,f){s.seq=s.seq||[];var ord=shuf(t.parts.length,seedOf(S[i].id+'o'+k));
 if(s.ok)s.seq=t.parts.map(function(_,j){return j});
 b.innerHTML='<div class="build">'+(s.seq.length?s.seq.map(function(j){return t.parts[j]}).join(' '):'<span class="small">Toquen las piezas en orden…</span>')+'</div><div class="opts"></div>';
 if(!s.ok)ord.forEach(function(j){if(s.seq.indexOf(j)>-1)return;var x=document.createElement('button');x.className='opt';x.textContent=t.parts[j];x.onclick=function(){s.seq.push(j);if(s.seq.length==t.parts.length){var good=s.seq.every(function(v,q){return v==q});if(good)s.ok=1;else s.wrong=1}save();redraw(i)};b.querySelector('.opts').appendChild(x)});
 if(s.ok)okMsg(f,t);else if(s.wrong&&s.seq.length==t.parts.length){f.innerHTML='<div class="badm">El orden no es correcto. </div>';var r=document.createElement('button');r.className='btn ghost';r.textContent='Empezar de nuevo';r.onclick=function(){s.seq=[];s.wrong=0;save();redraw(i)};f.appendChild(r)}
 else if(s.seq.length){var u=document.createElement('button');u.className='opt';u.textContent='↶ Quitar la última';u.onclick=function(){s.seq.pop();save();redraw(i)};f.appendChild(u)}}
/* pairs */
function dPairs(i,k,t,s,b,f){s.m=s.m||{};var ordL=shuf(t.L.length,seedOf(S[i].id+'l'+k)),ordR=shuf(t.R.length,seedOf(S[i].id+'r'+k+'x'));
 b.innerHTML='<div class="pairs"><div class="colL"></div><div class="colR"></div></div>';
 ordL.forEach(function(j){var x=document.createElement('button');var done=s.m[j];x.className='pl'+(done?' matched':'')+(s.selL===j?' cur':'');x.innerHTML=t.L[j]+(done?'<span class="tagm">'+t.R[j]+'</span>':'');x.disabled=!!done;x.onclick=function(){s.selL=j;s.err=null;save();redraw(i)};b.querySelector('.colL').appendChild(x)});
 ordR.forEach(function(j){var used=s.m[j];var x=document.createElement('button');x.className='pr'+(used?' used':'')+(s.err===j?' wrong':'');x.textContent=t.R[j];x.disabled=!!used;
  x.onclick=function(){if(s.selL==null){s.hint=1;save();redraw(i);return}if(s.selL===j){s.m[j]=1;s.selL=null;s.err=null;if(Object.keys(s.m).length==t.L.length)s.ok=1}else{s.err=j}save();redraw(i)};b.querySelector('.colR').appendChild(x)});
 if(s.ok)okMsg(f,t);else if(s.err!=null)f.innerHTML='<div class="badm">No es esa pareja. Relean y prueben otra.</div>';else if(s.hint)f.innerHTML='<p class="small">Primero toquen un elemento de la izquierda.</p>'}
/* highlight */
function dHl(i,k,t,s,b,f){s.sel=s.sel||[];
 b.innerHTML='<div class="hlx">'+t.toks.map(function(x,j){var c='';var on=s.sel.indexOf(j)>-1;if(s.ok&&x[1])c='good';else if(s.chk){if(x[1]&&on)c='good';else if(on)c='bad'}else if(on)c='on';return '<span data-j="'+j+'" class="'+c+'">'+x[0]+'</span>'}).join('')+'</div>';
 if(!s.ok){[].forEach.call(b.querySelectorAll('span'),function(sp){sp.onclick=function(){var j=+sp.dataset.j;var q=s.sel.indexOf(j);if(q>-1)s.sel.splice(q,1);else s.sel.push(j);s.chk=0;save();redraw(i)}});
  var r=document.createElement('button');r.className='btn';r.textContent='Revisar';r.onclick=function(){s.chk=1;var keys=t.toks.map(function(x,j){return x[1]?j:-1}).filter(function(j){return j>-1});var good=keys.every(function(j){return s.sel.indexOf(j)>-1})&&s.sel.length==keys.length;if(good)s.ok=1;save();redraw(i)};b.appendChild(r)}
 if(s.ok)okMsg(f,t);else if(s.chk)f.innerHTML='<div class="badm">Todavía no. Busquen en la tabla las palabras del descriptor.</div>'}
/* sort (classify each item) */
function dSort(i,k,t,s,b,f){s.r=s.r||{};var ord=shuf(t.items.length,seedOf(S[i].id+'s'+k));var n=0;
 ord.forEach(function(j){var it=t.items[j],r=s.r[j]||{};if(r.ok)n++;var d=document.createElement('div');d.className='q'+(r.ok?' right':r.bad?' wrong':'');
  d.innerHTML='<div class="txt">'+it[0]+'</div><div class="opts'+(t.scale?' scale':'')+'"></div><div class="fb">'+(r.ok?'✓ '+it[2]:r.bad?'Todavía no. Discútanlo y prueben otra.':'')+'</div>';
  t.o.forEach(function(o,q){var x=document.createElement('button');x.className='opt'+(r.ok&&q==it[1]?' sel':'')+((r.bad||[]).indexOf(q)>-1&&!r.ok?' wrong':'');x.textContent=o;x.disabled=!!r.ok;x.onclick=function(){if(q==it[1])r.ok=1;else{r.bad=r.bad||[];r.bad.push(q)}s.r[j]=r;if(t.items.every(function(_,z){return s.r[z]&&s.r[z].ok}))s.ok=1;save();redraw(i)};d.querySelector('.opts').appendChild(x)});
  b.appendChild(d)});
 if(s.ok)f.innerHTML='<div class="good">✓ Parte completa.</div>';else f.innerHTML='<p class="small">'+n+' de '+t.items.length+' listas.</p>'}
function route(){var m=/c=([a-zA-Z]+)/.exec(location.hash);
 if(m){var i=unlock(m[1]);history.replaceState(null,'',location.pathname);if(state.team&&i>-1){station(i);return}if(i>-1)state.pending=i}
 if(state.team&&state.pending!=null){var p=state.pending;state.pending=null;save();station(p);return}
 home()}
window.addEventListener('hashchange',route);
route();
</script>
