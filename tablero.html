@media print{header.top,.tabs,.nav,.btn,.status,.stepnav,.noprint{display:none!important}.card{box-shadow:none;border:1px solid #ccc}body{background:#fff}}

        ['Dato: «El agua hierve a 100 °C»','Un dato es un hecho que se comprueba una vez. Después de comprobarlo, no queda nada que investigar durante seis semanas.'],
        ['Frase de póster: «Los recursos naturales son importantes»','Una frase de póster es una opinión o un consejo. Todos están de acuerdo y nadie necesita investigarla. Esta era la idea central de la Unidad del Año.'],
        ['Idea que viaja: «Las decisiones sobre los recursos naturales cambian la vida de las comunidades»','Afirma una relación entre dos cosas (las decisiones y la vida de las comunidades). Es verdad en muchos lugares y épocas. Y se puede investigar de muchas maneras.']]},
 {ph:'Pruébalo',k:'travel',h:'Prueba: ¿la frase funciona en otros contextos?'},
 {ph:'Aprende',k:'learn',h:'¿Qué hace viajar a una idea?',

        ['¿Por qué sin lugares ni fechas?','Un lugar o una fecha amarra la idea. El ejemplo concreto se estudia dentro de la unidad, no en la idea central.']]},
 {ph:'Pruébalo',k:'tiles',h:'Taller de piezas'},

{id:'evidencia',tag:'DÍA 2 · EVIDENCIA',title:'Tres cuadernos',steps:[
 {ph:'Aprende',k:'learn',h:'¿Qué cuenta como evidencia?',
  body:'<div class="ctx">A mitad de la Unidad del Año, la docente pregunta: <b>«¿Por qué importan las decisiones que tomamos sobre los recursos naturales?»</b></div>Evidencia es lo que el alumnado dice, hace o crea, y que nos deja ver lo que comprende. Sirve para decidir el siguiente paso.',
  taps:[['¿Una prueba al final es evidencia?','Sí, pero llega tarde: ya no da tiempo de ajustar nada. La evidencia más útil se recoge durante la unidad.'],
        ['¿Más datos es más comprensión?','No. Un alumno puede saber muchos datos sin conectarlos. Lo van a ver en el siguiente paso.']]},

 {ph:'Reto',k:'reto',h:'Tres cuadernos nuevos',body:'<div class="ctx">Unidad de 3.º · La docente pregunta: <b>«¿Por qué cambian los precios en el mercado?»</b></div>Cuenta el primer intento.',

 var trav=w>0&&!/\d/.test(v)&&!/\s[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+/.test(v.slice(1).replace(/[.!?]\s+[A-ZÁÉÍÓÚÑ]/g,''));
 var inq=w>0&&rel&&!/(debemos|hay que|tenemos que|deberíamos|es importante|son importantes|es bueno|es malo|son buenos|son malos)/i.test(v);
 return [rel,trav,inq];}
function lightsHTML(k){var L=lightsFor(S.a[k]),v=(S.a[k]||'').trim();var tip=!v?'':!L[0]?'Pista: ¿dice cómo se relacionan dos cosas? Busquen un verbo de relación.':!L[1]?'Pista: ¿nombra un lugar, una fecha o un número? Quítenlo para que viaje.':!L[2]?'Pista: suena a consejo de póster.':'Las pistas se ven bien. Confírmenlo ustedes abajo.';
 return '<div class="lights">'+LNAMES.map(function(n,j){return '<span class="'+(L[j]?'on':'')+'">'+n+'</span>'}).join('')+'</div><div class="small">'+tip+'</div>'}

 return h;
}

function aval(k){var v=S.a[k];return Array.isArray(v)?v.join(', '):(v||'')}
function summary(){var rows='';SUMK.forEach(function(p){var v=Array.isArray(p[1])?p[1].map(aval).filter(Boolean).map(function(x,j){return (j+1)+'. '+x}).join('<br>'):esc(aval(p[1]));if(Array.isArray(p[1]))v=p[1].map(aval).filter(Boolean).map(function(x,j){return (j+1)+'. '+esc(x)}).join('<br>');if(v)rows+='<dt>'+p[0]+'</dt><dd>'+v+'</dd>'});
 if(!rows)return '';return '<details class="sum"'+(S.sumClosed?'':' open')+' ontoggle="S.sumClosed=!this.open;sv()"><summary>📋 Su unidad hasta ahora</summary><dl>'+rows+'</dl></details>'}
function togRC(k,o,btn){var a=S.a[k]||[];var j=a.indexOf(o);if(j>-1)a.splice(j,1);else a.push(o);S.a[k]=a;sv();btn.classList.toggle('sel')}
function lineStarter(k){var cs=S.a.e4||[];var L=LSTART.filter(function(x){return cs.indexOf(x[0])>-1}).concat(LSTART.filter(function(x){return cs.indexOf(x[0])<0}));
 return '<select style="margin-bottom:6px;font-size:14px" onchange="useStart(\''+k+'\',this.value)"><option value="">Ayuda: empezar con…</option>'+L.map(function(x){return '<option value="'+x[1]+'">'+x[0]+': '+x[1]+'…</option>'}).join('')+'</select>'}
function useStart(k,v){if(!v)return;var e=document.getElementById('in_'+k);var cur=(S.a[k]||'').trim();var nv=v+' '+(cur&&cur.indexOf(v)!==0?cur:'');S.a[k]=nv;sv();if(e){e.value=nv;e.focus();var w=document.getElementById('lw_'+k);if(w)w.textContent=lineWarn(nv)}}
function ideaHelp(){var x=X('ib');var t=S.a.e2;var mods=(IDEAS[t]||[]).map(function(m){return '<button class="chip" style="text-align:left" onclick="useIdea(this.textContent)">'+m+'</button>'}).join('');
 return '<details class="sum" style="background:#f7f1ff;border-color:#d9c6f0"'+(x.open?' open':'')+' ontoggle="X(\'ib\').open=this.open;sv()"><summary>🧩 Ayuda para armarla (opcional)</summary>'
 +(t?'<p class="hint" style="margin-top:8px"><b>Modelos para '+esc(t)+'.</b> Toquen uno para usarlo como punto de partida y adáptenlo a su unidad:</p><div class="chips" style="flex-direction:column">'+mods+'</div>':'<p class="hint">Elijan antes el tema transdisciplinario (paso anterior) para ver modelos.</p>')
 +'<p class="hint" style="margin-top:10px"><b>O ármenla por partes:</b> ¿quién o qué? + verbo que une + ¿con qué?</p>'
 +'<input type="text" id="ib_a" list="ib_al" placeholder="¿Quién o qué? Ej.: Las comunidades" value="'+esc(x.a)+'" oninput="ibSet(\'a\',this.value)"><datalist id="ib_al">'+SUBJ.map(function(o){return '<option value="'+o+'">'}).join('')+'</datalist>'
 +'<select style="margin:6px 0" onchange="ibSet(\'v\',this.value)"><option value="">Verbo que une…</option>'+VERBS.map(function(o){return '<option'+(x.v==o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'
 +'<input type="text" placeholder="¿Con qué? Ej.: el lugar donde viven" value="'+esc(x.b)+'" oninput="ibSet(\'b\',this.value)">'
 +'<div class="build" id="ib_prev" style="font-size:15px;margin-top:8px">'+ibText()+'</div><button class="btn" style="margin-top:4px" onclick="useIdea(ibText())">Usar esta frase</button></details>'}
function ibText(){var x=X('ib');var t=[x.a,x.v,x.b].filter(Boolean).join(' ').trim();return t?t.charAt(0).toUpperCase()+t.slice(1).replace(/\.?$/,'.'):''}
function ibSet(k,v){X('ib')[k]=v;sv();var e=document.getElementById('ib_prev');if(e)e.textContent=ibText()}
function useIdea(t){if(!t)return;S.a.e3=t;X('ib').open=1;sv();var m=mod('nucleo');document.getElementById('stepbody').innerHTML=stepHTML(m,m.steps[S.st.nucleo||0],S.st.nucleo||0)}
function lineWarn(v){v=(v||'').trim();if(!v)return '';if(/\?\s*$/.test(v)||/^¿/.test(v))return 'Escríbanla como enunciado, no como pregunta.';if(/^(hacer|elaborar|realizar|dibujar|visitar|crear|investigar|leer|escribir|presentar)\b/i.test(v))return 'Eso suena a actividad. Una línea dice qué se va a comprender.';return ''}
function field(f){
 var v=S.a[f.k],lab='<label>'+f.q+(f.opc?'<span class="opc">OPCIONAL</span>':'')+'</label>'+(f.hint?'<div class="hint">'+f.hint+'</div>':'');
 if(f.t=='t')return '<div class="f">'+lab+'<textarea oninput="setv(\''+f.k+'\',this.value'+(f.lights?',1':'')+')">'+esc(v)+'</textarea>'+(f.lights?'<div id="lights_'+f.k+'">'+lightsHTML(f.k)+'</div>':'')+(f.build?ideaHelp():'')+'</div>';
 if(f.t=='x')return '<div class="f">'+lab+(f.line?lineStarter(f.k):'')+'<input type="text" id="in_'+f.k+'" value="'+esc(v)+'" oninput="setv(\''+f.k+'\',this.value'+(f.line?',2':'')+')">'+(f.line?'<div class="warn" id="lw_'+f.k+'">'+lineWarn(v)+'</div>':'')+'</div>';
 if(f.t=='s')return '<div class="f">'+lab+'<select onchange="setv(\''+f.k+'\',this.value'+(f.desc?',3':'')+')"><option value="">Elijan…</option>'+f.o.map(function(o){return '<option'+(v==o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'+(f.desc?'<div class="hint" id="td_'+f.k+'" style="margin-top:6px">'+(TDESC[v]||'')+'</div>':'')+'</div>';
 if(f.t=='c'||f.t=='cq'||f.t=='cq1'){var a=v||[];if(f.t=='cq1'&&!Array.isArray(a))a=[a];
  return '<div class="f">'+lab+'<div class="chips">'+f.o.map(function(o,i){var n=Array.isArray(o)?o[0]:o,sub=Array.isArray(o)?'<small>'+o[1]+'</small>':'';return '<button class="chip'+(a.indexOf(n)>-1?' sel':'')+'" onclick="tog(\''+f.k+'\','+i+',this)">'+n+sub+'</button>'}).join('')+'</div></div>'}
 if(f.t=='rc'){var a=v||[];return '<div class="f">'+lab+RCON.map(function(g){return '<div class="hint" style="margin-top:8px;font-weight:800">'+g[0]+'</div><div class="chips">'+g[1].map(function(o){return '<button class="chip'+(a.indexOf(o)>-1?' sel':'')+'" onclick="togRC(\''+f.k+'\',\''+o+'\',this)">'+o+'</button>'}).join('')+'</div>'}).join('')+'</div>'}
 if(f.t=='k'){var b=v||[];return '<div class="f">'+lab+f.o.map(function(o,i){return '<label class="chk"><input type="checkbox"'+(b.indexOf(o)>-1?' checked':'')+' onchange="tog(\''+f.k+'\','+i+')"> '+o+'</label>'}).join('')+'</div>'}
 return '';
}

function findF(k){var r;MODS.d3.forEach(function(m){allFields(m).forEach(function(f){if(f.k==k)r=f})});return r}
function val(f){var v=S.a[f.k];if(Array.isArray(v))return v.join(', ');return v||''}
function reviewH(m){
 var h='<p>Revisen. Si algo falta, toquen «Atrás». Cuando estén listos, envíen.</p>';
 allFields(m).forEach(function(f){var v=val(f);h+='<div class="item"><div class="meta">'+f.q+(f.opc?' · opcional':'')+'</div><div style="font-size:15px;font-weight:600">'+(v?esc(v):f.opc?'<span style="color:var(--grey)">Opcional · sin llenar</span>':'<span style="color:var(--bad)">Falta</span>')+'</div></div>'});
 return h+sendBtn(m.id);
}

function tog(k,i,btn){var f=findF(k),o=f.o[i];o=Array.isArray(o)?o[0]:o;
 if(f.t=='cq1'){S.a[k]=o;sv();btn.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.remove('sel')});btn.classList.add('sel');return}
 var a=S.a[k]||[];var j=a.indexOf(o);if(j>-1)a.splice(j,1);else a.push(o);S.a[k]=a;sv();if(btn)btn.classList.toggle('sel')}

/* ======================= evidence ======================= */
function retoItems(m){var it=[];m.steps.forEach(function(st,i){if(st.k!='reto')return;var R=S.r[rkey(m,i)]||{},f=0,d=0;
 st.items.forEach(function(x,j){var r=R[j];if(r&&r.done){d++;if(r.first)f++}it.push({q:'Reto · '+(x.meta?x.meta+' ':'')+x.txt.replace(/<[^>]+>/g,''),a:!r?'Sin responder':r.done?(r.first?'✓ al primer intento: ':'✓ después de corregir (primero eligieron «'+r.miss+'»): ')+x.o[x.ans]:'Sin terminar'})});
 it.unshift({q:'RESULTADO DEL RETO',a:f+' de '+st.items.length+' al primer intento ('+d+' completas)'})});return it}
function items(id){var m=mod(id),it=[],x=X(id);
 if(id=='acceso'){var c=x.sim||{};it.push({q:'Simulador · configuración final',a:SW.map(function(s){return s.lb+': '+s.o[c[s.k]||0]}).join(' · ')});
  it.push({q:'Simulador · resultado',a:(c.green||0)+' de 4 alumnos en verde'+(c.trapped?'. Probaron bajar la meta y el simulador los detuvo.':'.')});
  it=it.concat(retoItems(m));it.push({q:'Con sus palabras: quitar una barrera vs. bajar la meta',a:S.a.a_line||'—'});if(S.a.a_real)it.push({q:'Un alumno real',a:S.a.a_real})}
 if(id=='significado'){it.push({q:'Frases probadas en otros contextos',a:(x.trips||[]).map(function(k){return TRIP[k].lab}).join(', ')||'—'});
  it.push({q:'Taller de piezas · frase admitida',a:x.tileok||('No llegaron a una frase admitida. Última frase: '+(x.tilelast||'—'))});
  it=it.concat(retoItems(m));it.push({q:'Con sus palabras: idea que viaja vs. frase de póster',a:S.a.b_line||'—'})}
 if(id=='evidencia'){it.push({q:'La lupa sobre Bruno',a:x.check?(x.hlscore||0)+' de 3 palabras de conexión encontradas':'No revisado'});
  it.push({q:'Preguntas que le hicieron a Camila (en orden)',a:(x.br||[]).map(function(k){return BR[k].q}).join(' → ')||'—'});
  SO.forEach(function(s,i){it.push({q:'Si observamos… · '+s.n,a:(x.so&&x.so[i]!=null)?soSentence(i)+((x.sof&&x.sof[i])?' (primer intento)':' (después de corregir)'):'Sin terminar'})});
  it=it.concat(retoItems(m));it.push({q:'Con sus palabras: qué preguntarle a un alumno que suena a póster',a:S.a.c_line||'—'})}
 if(MODS.d3.indexOf(m)>-1)allFields(m).forEach(function(f){it.push({q:f.q,a:val(f)||'—'})});
 return it}
function send(id,btn){
 var m=mod(id),st=document.getElementById('st_'+id);
 var line={acceso:'a_line',significado:'b_line',evidencia:'c_line'}[id];
 if(line&&!S.a[line]&&!confirm('Falta su frase. ¿Enviar de todos modos?'))return;
 if(!line){var empty=allFields(m).filter(function(f){return !f.opc&&!val(f)});if(empty.length&&!confirm('Faltan '+empty.length+' respuesta(s). ¿Enviar de todos modos?'))return}
 btn.disabled=true;st.className='status';st.textContent='Enviando…';
 var body=JSON.stringify({team:S.team,title:m.tag+' · '+m.title,items:items(id)});
 var done=false,timer=setTimeout(function(){if(!done){done=true;fail()}},25000);
 function ok(){var t=new Date();S.sent[id]=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);sv();btn.disabled=false;st.className='status ok';st.textContent='✓ Evidencia enviada a la carpeta del equipo '+S.team+'.';document.getElementById('c_'+id).classList.add('sent')}
 function fail(){btn.disabled=false;st.className='status bad';st.innerHTML='No se pudo enviar. Revisen el wifi y toquen otra vez. <a href="javascript:printSec(\''+id+'\')">Descargar copia en PDF</a>'}
 fetch(ENDPOINT,{method:'POST',body:body}).then(function(r){return r.json()}).then(function(j){if(done)return;done=true;clearTimeout(timer);if(j&&j.ok)ok();else fail()}).catch(function(){if(done)return;done=true;clearTimeout(timer);fail()});
}
function printSec(id){var w=window.open('','_blank');if(!w){window.print();return}
 w.document.write('<meta charset="utf-8"><title>Evidencia</title><body style="font-family:Arial;margin:24px"><h2>'+esc(mod(id).tag+' · '+mod(id).title)+'</h2><p>Equipo '+esc(S.team)+'</p>'+items(id).map(function(i){return '<p><b>'+esc(i.q)+'</b><br>'+esc(i.a)+'</p>'}).join('')+'</body>');w.document.close();w.print()}

 var d=S.day=='d3'?'d3':'d2',h='<div class="pres"><button class="x" onclick="this.parentNode.remove()">Cerrar</button><div class="tag" style="color:#1ab7ea">'+teamIcon()+' EQUIPO '+esc(S.team).toUpperCase()+'</div>';

  if(ev.so&&ev.so[2]!=null)add('SI OBSERVAMOS…',soSentence(2));
  add('LA PREGUNTA QUE ABRE',S.a.c_line);}
 else{add('UNIDAD',[aval('e1'),aval('e1g')].filter(Boolean).join(' · '));[['TEMA','e2'],['IDEA CENTRAL','e3'],['CONCEPTOS CLAVE','e4'],['CONCEPTOS RELACIONADOS','e4r'],['LÍNEAS DE INDAGACIÓN','e5'],['','e6'],['','e7'],['','e7b'],['PROVOCACIÓN','x1'],['EVIDENCIA CONVINCENTE','ob3'],['AGENCIA · ELECCIÓN','g1b'],['SI OBSERVAMOS…','g2'],['EVALUACIÓN FINAL','ev5'],['BARRERA QUE QUITAMOS','ac2']].forEach(function(p){add(p[0],aval(p[1]))})}
 var e=document.createElement('div');e.innerHTML=h+'</div>';document.body.appendChild(e.firstChild);
}
render();
